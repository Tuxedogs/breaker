<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 315 86" fill="none" preserveAspectRatio="none">
  <defs>
    <linearGradient id="edge" x1="5" y1="5" x2="310" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#315361" stop-opacity=".78"/>
      <stop offset=".55" stop-color="#1c3441" stop-opacity=".72"/>
      <stop offset="1" stop-color="#273d47" stop-opacity=".64"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="20" x2="0" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#46c4ee" stop-opacity="0"/>
      <stop offset=".25" stop-color="#46c4ee" stop-opacity=".34"/>
      <stop offset=".78" stop-color="#3599bf" stop-opacity=".22"/>
      <stop offset="1" stop-color="#3599bf" stop-opacity="0"/>
