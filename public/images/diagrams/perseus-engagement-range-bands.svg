<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Perseus engagement range bands</title>
  <desc id="desc">A horizontal tactical reference showing 0 to 500 meters in green, 501 to 1000 meters in yellow, and 1 kilometer to 5.6 kilometers in red.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1016" />
      <stop offset="100%" stop-color="#121a22" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />
  <rect x="78" y="86" width="1044" height="504" rx="22" fill="#0f1720" stroke="rgba(255,255,255,0.12)" filter="url(#softShadow)" />

  <text x="120" y="150" fill="#e2e8f0" font-family="Rajdhani, sans-serif" font-size="44" font-weight="700" letter-spacing="2">PERSEUS ENGAGEMENT RANGE BANDS</text>
  <text x="120" y="196" fill="#94a3b8" font-family="Barlow, sans-serif" font-size="22">Main battery color calls are keyed to distance from target.</text>

  <text x="120" y="262" fill="#cbd5e1" font-family="Share Tech Mono, monospace" font-size="20" letter-spacing="1.5">MAIN BATTERY ENGAGEMENT RANGE</text>
  <rect x="120" y="286" width="960" height="58" rx="16" fill="#1f2937" />
  <rect x="120" y="286" width="85.714" height="58" rx="16" fill="#3a9860" />
  <rect x="205.714" y="286" width="85.714" height="58" fill="#fbbf24" />
  <rect x="291.428" y="286" width="788.572" height="58" rx="16" fill="#c84840" />

  <line x1="120" y1="274" x2="120" y2="368" stroke="#64748b" stroke-width="2" />
  <line x1="205.714" y1="274" x2="205.714" y2="368" stroke="#64748b" stroke-width="2" />
  <line x1="291.428" y1="274" x2="291.428" y2="368" stroke="#64748b" stroke-width="2" />
  <line x1="1080" y1="274" x2="1080" y2="368" stroke="#64748b" stroke-width="2" />

  <text x="120" y="392" fill="#cbd5e1" font-family="Share Tech Mono, monospace" font-size="18">0m</text>
  <text x="181" y="392" fill="#cbd5e1" font-family="Share Tech Mono, monospace" font-size="18">500m</text>
  <text x="252" y="392" fill="#cbd5e1" font-family="Share Tech Mono, monospace" font-size="18">1km</text>
  <text x="1016" y="392" fill="#cbd5e1" font-family="Share Tech Mono, monospace" font-size="18">5.6km</text>

  <text x="162.857" y="322" text-anchor="middle" dominant-baseline="middle" fill="#f8fafc" font-family="Share Tech Mono, monospace" font-size="14" font-weight="700">0-500m</text>
  <text x="248.571" y="322" text-anchor="middle" dominant-baseline="middle" fill="#0f1720" font-family="Share Tech Mono, monospace" font-size="14" font-weight="700">501-1000m</text>
  <text x="685.714" y="322" text-anchor="middle" dominant-baseline="middle" fill="#f8fafc" font-family="Share Tech Mono, monospace" font-size="22" font-weight="700">1km-5.6km</text>

  <text x="120" y="462" fill="#94a3b8" font-family="Share Tech Mono, monospace" font-size="18" letter-spacing="1.5">STALKER V TORPEDO ENVELOPE</text>
  <rect x="120" y="484" width="960" height="22" rx="11" fill="#334155" opacity="0.65" />
  <rect x="291.428" y="484" width="788.572" height="22" rx="11" fill="#94a3b8" opacity="0.9" />
  <line x1="291.428" y1="474" x2="291.428" y2="524" stroke="#64748b" stroke-width="2" />
  <line x1="1080" y1="474" x2="1080" y2="524" stroke="#64748b" stroke-width="2" />
  <text x="260" y="552" fill="#cbd5e1" font-family="Share Tech Mono, monospace" font-size="18">1km</text>
  <text x="1016" y="552" fill="#cbd5e1" font-family="Share Tech Mono, monospace" font-size="18">5.6km</text>
</svg>
