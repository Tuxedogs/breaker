<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Perseus engagement range bands</title>
  <desc id="desc">A horizontal tactical reference showing torpedo, maximum, degraded, and optimal range bands for the Perseus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1016" />
      <stop offset="100%" stop-color="#121a22" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" />
  <rect x="90" y="150" width="1020" height="300" rx="18" fill="#0f1720" stroke="rgba(255,255,255,0.12)" />
  <rect x="120" y="286" width="960" height="28" rx="14" fill="#1f2937" />
  <rect x="120" y="286" width="19.2" height="28" rx="14" fill="#5eead4" />
  <rect x="139.2" y="286" width="30.72" height="28" fill="#fbbf24" />
  <rect x="169.92" y="286" width="69.12" height="28" fill="#f87171" />
  <rect x="120" y="344" width="960" height="18" rx="9" fill="#334155" opacity="0.6" />
  <rect x="184" y="344" width="896" height="18" rx="9" fill="#94a3b8" opacity="0.9" />
  <text x="120" y="120" fill="#e2e8f0" font-family="Rajdhani, sans-serif" font-size="42" font-weight="700" letter-spacing="2">PERSEUS ENGAGEMENT RANGE BANDS</text>
  <text x="120" y="186" fill="#94a3b8" font-family="Barlow, sans-serif" font-size="22">Use this as the canonical range reference for main battery and Stalker V employment.</text>
  <text x="120" y="270" fill="#5eead4" font-family="Share Tech Mono, monospace" font-size="18">MAIN BATTERY</text>
  <text x="184" y="410" fill="#94a3b8" font-family="Share Tech Mono, monospace" font-size="18">STALKER V TORPEDO ENVELOPE</text>
  <line x1="120" y1="250" x2="120" y2="324" stroke="#475569" />
  <line x1="139.2" y1="250" x2="139.2" y2="324" stroke="#475569" />
  <line x1="169.92" y1="250" x2="169.92" y2="324" stroke="#475569" />
  <line x1="239.04" y1="250" x2="239.04" y2="324" stroke="#475569" />
  <line x1="184" y1="332" x2="184" y2="376" stroke="#475569" />
  <line x1="1080" y1="332" x2="1080" y2="376" stroke="#475569" />
  <text x="120" y="248" fill="#cbd5e1" font-family="Share Tech Mono, monospace" font-size="16">0.5 km</text>
  <text x="139.2" y="248" fill="#cbd5e1" font-family="Share Tech Mono, monospace" font-size="16">1.2 km</text>
  <text x="169.92" y="248" fill="#cbd5e1" font-family="Share Tech Mono, monospace" font-size="16">2.0 km</text>
  <text x="239.04" y="248" fill="#cbd5e1" font-family="Share Tech Mono, monospace" font-size="16">5.6 km</text>
  <text x="184" y="398" fill="#cbd5e1" font-family="Share Tech Mono, monospace" font-size="16">2 km</text>
  <text x="1048" y="398" fill="#cbd5e1" font-family="Share Tech Mono, monospace" font-size="16">30 km</text>
  <text x="124" y="279" fill="#0f1720" font-family="Share Tech Mono, monospace" font-size="15">OPTIMAL</text>
  <text x="143" y="279" fill="#0f1720" font-family="Share Tech Mono, monospace" font-size="15">DEGRADED</text>
  <text x="176" y="279" fill="#0f1720" font-family="Share Tech Mono, monospace" font-size="15">MAXIMUM</text>
  <text x="120" y="500" fill="#f8fafc" font-family="Barlow, sans-serif" font-size="22">Call the band before the merge, at the break, and before recommit.</text>
  <text x="120" y="536" fill="#64748b" font-family="Barlow, sans-serif" font-size="19">Do not waste main-battery pressure outside the degraded band when the ship has a safe alternative.</text>
</svg>
